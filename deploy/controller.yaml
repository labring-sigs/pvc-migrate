apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-migrate-controller
  namespace: pvc-migrate-system
  labels:
    app.kubernetes.io/name: pvc-migrate
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: pvc-migrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pvc-migrate
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvc-migrate
        app.kubernetes.io/component: controller
        app.kubernetes.io/managed-by: pvc-migrate
    spec:
      serviceAccountName: pvc-migrate
      containers:
        - name: controller
          image: ghcr.io/labring-sigs/pvc-migrate:dev
          imagePullPolicy: IfNotPresent
          args:
            - controller
            - --mode=controller
            - --session-namespace=pvc-migrate-system
            - --log-level=info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
