apiVersion: v1
kind: Service
metadata:
  name: {{ include "pvc-migrate.fullname" . }}-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvc-migrate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "pvc-migrate.selectorLabels" . | nindent 4 }}
