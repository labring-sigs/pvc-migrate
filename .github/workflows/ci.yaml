name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v4.2.4
      - run: helm lint charts/pvc-migrate --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
      # Fails when generated deepcopy/CRD artifacts (including the chart CRD
      # copies refreshed by chart-sync) drift from the committed files; the
      # staging step also catches newly generated files that were never added.
      - run: make manifests
      - run: git add -A
      - run: git diff --cached --exit-code

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
