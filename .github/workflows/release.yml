name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "**/*.yaml"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "**/*.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        targets:
          - GOOS: linux
            GOARCH: arm64
          - GOOS: linux
            GOARCH: amd64
          - GOOS: darwin
            GOARCH: arm64
          - GOOS: darwin
            GOARCH: amd64
          - GOOS: windows
            GOARCH: amd64
            EXT: .exe
          - GOOS: windows
            GOARCH: arm64
            EXT: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build
        run: |
          set -euo pipefail
          export GOOS=${{ matrix.targets.GOOS }}
          export GOARCH=${{ matrix.targets.GOARCH }}
          export CGO_ENABLED=0
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${version} -X main.toolImageRepository=ghcr.io/${GITHUB_REPOSITORY}" -o "pvc-migrate-${{ matrix.targets.GOOS }}-${{ matrix.targets.GOARCH }}${{ matrix.targets.EXT }}" ./cmd/pvc-migrate

      - name: Get release meta
        id: release_meta
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version: ${version}"
          prerelease="$(printf '%s' "${version}" | grep -E 'rc|beta|alpha|pre|dev|snapshot|nightly' || true)"
          release_name="Version ${version}"
          echo "release_name: ${release_name}"
          if [ -n "${prerelease}" ]; then
            prerelease=true
            release_name="${release_name} (Prerelease)"
          else
            prerelease=false
          fi
          tag_name="v${version}"
          echo "prerelease: ${prerelease}"
          echo "tag_name: ${tag_name}"

          {
            echo "PRERELEASE=${prerelease}"
            echo "RELEASE_NAME=${release_name}"
            echo "TAG_NAME=${tag_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_meta.outputs.TAG_NAME }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.RELEASE_NAME }}
          PRERELEASE: ${{ steps.release_meta.outputs.PRERELEASE }}
          ASSET_FILE: pvc-migrate-${{ matrix.targets.GOOS }}-${{ matrix.targets.GOARCH }}${{ matrix.targets.EXT }}
        run: |
          set -euo pipefail

          test -f "${ASSET_FILE}"

          # The GitHub API intermittently answers mutations with 5xx and the gh
          # CLI does not retry them; linear backoff keeps a transient failure
          # from deciding whether an asset ships.
          retry() {
            local attempts=$1
            shift

            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge "${attempts}" ]; then
                return 1
              fi

              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          release_exists() {
            gh release view "${TAG_NAME}" --json tagName >/dev/null 2>&1
          }

          asset_attached() {
            gh release view "${TAG_NAME}" --json assets --jq '.assets[].name' \
              | grep -qx "${ASSET_FILE}"
          }

          # Every matrix job runs this step: the first to arrive creates the
          # release and the rest attach their asset to it. A lost race and a
          # transient API error both surface as a failed create, so the outcome
          # is decided by observing the release, not by the create exit code.
          if ! release_exists; then
            release_args=(
              "${TAG_NAME}"
              --title "${RELEASE_NAME}"
              --verify-tag
              --generate-notes
            )
            if [[ "${PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            fi

            gh release create "${release_args[@]}" || true
            retry 6 release_exists
          fi

          # --clobber keeps the upload idempotent across retries and job re-runs.
          retry 6 gh release upload "${TAG_NAME}" "${ASSET_FILE}" --clobber

          # The upload call can be acknowledged before the asset is listed; the
          # step succeeds only once the asset is visible on the release.
          retry 6 asset_attached
